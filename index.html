    <script>

                "icons": [
                    {
                        "src": "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='20' height='12' x='2' y='6' rx='2'/%3E%3Ccircle cx='12' cy='12' r='2'/%3E%3Cpath d='M6 12h.01M18 12h.01'/%3E%3C/svg%3E",

    <style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mis-finanzas-compartidas';
        let app = null;
        let auth = null;
        let db = null;

        function setupFirebaseInstance() {
            if (db && auth) return true;
            try {
                let firebaseConfig = null;
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                } else {
                    const savedConfig = localStorage.getItem('finanzas_custom_firebase_config');
                    if (savedConfig) {
                        firebaseConfig = JSON.parse(savedConfig);
                    }
                }

                if (firebaseConfig && firebaseConfig.apiKey) {
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    return true;
                }
            } catch (e) {
                console.warn("Firebase no configurado aún o credenciales inválidas:", e);
            }
            return false;
        }

        setupFirebaseInstance();

        // Limpiador flexible para cualquier texto pegado desde Firebase
        function parseFlexibleFirebaseConfig(text) {
            if (!text) return null;
            try {
                return JSON.parse(text);
            } catch(e) {
                try {
                    const match = text.match(/\{[\s\S]*\}/);
                    if (match) {
                        const fn = new Function('return ' + match[0]);
                        return fn();
                    }
                } catch(err) {
                    return null;
                }
            }
            return null;
        }

        window.FirebaseBridge = {
            appId,
            isAvailable: () => setupFirebaseInstance(),
            saveCustomConfig: (rawText) => {
                const configObj = parseFlexibleFirebaseConfig(rawText);
                if (configObj && configObj.apiKey) {
                    localStorage.setItem('finanzas_custom_firebase_config', JSON.stringify(configObj));
                    return true;
                }
                return false;
            },
            initAuth: async () => {
                if (!setupFirebaseInstance()) return null;
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                        return userCred.user;
                    } else {
                        const userCred = await signInAnonymously(auth);
                        return userCred.user;
                    }
                } catch (e) {
                    console.error("Error de autenticación:", e);
                    return null;
                }
            },
            getPublicCollection: (collectionName) => {
                if (!setupFirebaseInstance()) return null;
                return collection(db, 'artifacts', appId, 'public', 'data', collectionName);
            },
            getPublicDoc: (collectionName, docId) => {
                if (!setupFirebaseInstance()) return null;
                return doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
            },
            setDoc,
            deleteDoc,
            onSnapshot
        };
    </script>

        const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconCloudUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.89 4 15a5 5 0 0 0 5 5h10a4 4 0 0 0 1.3-7.8 7 7 0 0 0-13.6-2.9A4 4 0 0 0 4 14.89z"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/></svg>;

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [user, setUser] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const [showGroupModal, setShowGroupModal] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [copied, setCopied] = useState(false);

            const [groupCode, setGroupCode] = useState(() => {
                const saved = localStorage.getItem('finanzas_group_code');
                if (saved) return saved.toUpperCase();
                const randomCode = 'FAMILIA-' + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('finanzas_group_code', randomCode);
                return randomCode;
            });

            const [inputGroupCode, setInputGroupCode] = useState('');

            const initDate = new Date();
            const initDay = initDate.getDate();
            let startMonthDate = new Date(initDate);
            let endMonthDate = new Date(initDate);

            if (initDay >= 24) {
                startMonthDate.setDate(24);
                endMonthDate.setMonth(endMonthDate.getMonth() + 1);
                endMonthDate.setDate(24);
            } else {
                startMonthDate.setMonth(startMonthDate.getMonth() - 1);
                startMonthDate.setDate(24);
                endMonthDate.setDate(24);
            }

            const [dateRange, setDateRange] = useState({
                start: startMonthDate.toISOString().split('T')[0],
                end: endMonthDate.toISOString().split('T')[0]
            });

            const [categories, setCategories] = useState(() => {
                try {
                    const saved = localStorage.getItem('finanzas_categories');
                    return saved ? JSON.parse(saved) : [
                        { id: '1', name: 'Alimentación', budget: 150000, isActive: true },
                        { id: '2', name: 'Transporte', budget: 40000, isActive: true },
                    ];
                } catch (e) {
                    return [
                        { id: '1', name: 'Alimentación', budget: 150000, isActive: true },
                        { id: '2', name: 'Transporte', budget: 40000, isActive: true },
                    ];
                }
            });

            const [transactions, setTransactions] = useState(() => {
                try {
                    const saved = localStorage.getItem('finanzas_transactions');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            useEffect(() => {
                localStorage.setItem('finanzas_categories', JSON.stringify(categories));
            }, [categories]);

            useEffect(() => {
                localStorage.setItem('finanzas_transactions', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                let unsubscribeCategories = null;
                let unsubscribeTransactions = null;

                async function setupRealtimeSync() {
                    if (!window.FirebaseBridge || !window.FirebaseBridge.isAvailable()) {
                        return;
                    }

                    setIsSyncing(true);
                    const authUser = await window.FirebaseBridge.initAuth();
                    setUser(authUser);

                    if (!authUser) {
                        setIsSyncing(false);
                        return;
                    }

                    const categoriesColRef = window.FirebaseBridge.getPublicCollection('categories');
                    const transactionsColRef = window.FirebaseBridge.getPublicCollection('transactions');

                    if (!categoriesColRef || !transactionsColRef) {
                        setIsSyncing(false);
                        return;
                    }

                    unsubscribeCategories = window.FirebaseBridge.onSnapshot(
                        categoriesColRef,
                        (snapshot) => {
                            const remoteCats = [];
                            snapshot.forEach(docSnap => {
                                const data = docSnap.data();
                                if (data.groupCode === groupCode) {
                                    remoteCats.push({ ...data, id: docSnap.id });
                                }
                            });

                            if (remoteCats.length > 0) {
                                setCategories(remoteCats);
                            }
                            setIsSyncing(false);
                        },
                        (error) => {
                            console.error("Error al sincronizar categorías:", error);
                            setIsSyncing(false);
                        }
                    );

                    unsubscribeTransactions = window.FirebaseBridge.onSnapshot(
                        transactionsColRef,
                        (snapshot) => {
                            const remoteTxs = [];
                            snapshot.forEach(docSnap => {
                                const data = docSnap.data();
                                if (data.groupCode === groupCode) {
                                    remoteTxs.push({ ...data, id: docSnap.id });
                                }
                            });

                            setTransactions(remoteTxs);
                            setIsSyncing(false);
                        },
                        (error) => {
                            console.error("Error al sincronizar transacciones:", error);
                            setIsSyncing(false);
                        }
                    );
                }

                setupRealtimeSync();

                return () => {
                    if (unsubscribeCategories) unsubscribeCategories();
                    if (unsubscribeTransactions) unsubscribeTransactions();
                };
            }, [groupCode]);

            const triggerToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3500);
            };

            const copyGroupCode = () => {
                const textArea = document.createElement("textarea");
                textArea.value = groupCode;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
                triggerToast(`Código "${groupCode}" copiado al portapapeles`);
            };

            const handleJoinGroup = (e) => {
                e.preventDefault();
                if (!inputGroupCode.trim()) return;
                const cleanCode = inputGroupCode.trim().toUpperCase().replace(/\s+/g, '-');
                setGroupCode(cleanCode);
                localStorage.setItem('finanzas_group_code', cleanCode);
                setInputGroupCode('');
                setShowGroupModal(false);
                triggerToast(`Te uniste al grupo "${cleanCode}"`);
            };

            const uploadLocalDataToCloud = async () => {
                if (!window.FirebaseBridge || !window.FirebaseBridge.isAvailable()) {
                    triggerToast("Primero configura la Nube en Vercel con el formulario de abajo.");
                    return;
                }

                if (!user) {
                    await window.FirebaseBridge.initAuth();
                }

                setIsSyncing(true);
                try {
                    for (const cat of categories) {
                        const docRef = window.FirebaseBridge.getPublicDoc('categories', cat.id);
                        await window.FirebaseBridge.setDoc(docRef, {
                            ...cat,
                            groupCode,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    }

                    for (const tx of transactions) {
                        const docRef = window.FirebaseBridge.getPublicDoc('transactions', tx.id);
                        await window.FirebaseBridge.setDoc(docRef, {
                            ...tx,
                            groupCode,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    }

                    triggerToast("¡Datos subidos a la nube exitosamente!");
                } catch (e) {
                    console.error("Error al respaldar en la nube:", e);
                    triggerToast("Revisa las reglas de Firestore en la consola de Firebase.");
                } finally {
                    setIsSyncing(false);
                }
            };

            const [editingTxId, setEditingTxId] = useState(null);
            const [newTx, setNewTx] = useState({ 
                date: new Date().toISOString().split('T')[0], 
                amount: '', 
                place: '', 
                categoryId: '', 
                method: 'Débito' 
            });
            
            const [newCat, setNewCat] = useState({ name: '', budget: '' });
            const [editingCatId, setEditingCatId] = useState(null);
            const [editCatData, setEditCatData] = useState({ name: '', budget: '' });

            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => t.date >= dateRange.start && t.date <= dateRange.end);
            }, [transactions, dateRange]);

            const groupedTransactions = useMemo(() => {
                const groups = {};
                filteredTransactions.forEach(tx => {
                    if (!groups[tx.date]) {
                        groups[tx.date] = [];
                    }
                    groups[tx.date].push(tx);
                });
                
                return Object.keys(groups)
                    .sort((a, b) => new Date(b) - new Date(a))
                    .map(date => ({
                        date,
                        txs: groups[date].sort((a, b) => b.id - a.id)
                    }));
            }, [filteredTransactions]);

            const categoryStats = useMemo(() => {
                return categories.map(cat => {
                    const spent = filteredTransactions
                        .filter(t => t.categoryId === cat.id)
                        .reduce((sum, t) => sum + Number(t.amount), 0);
                    return {
                        ...cat,
                        spent,
                        remaining: cat.budget - spent,
                        percent: Math.min((spent / cat.budget) * 100, 100)
                    };
                }).filter(cat => cat.isActive || cat.spent > 0);
            }, [categories, filteredTransactions]);

            const totalBudget = categoryStats.reduce((sum, cat) => sum + Number(cat.budget), 0);
            const totalSpent = filteredTransactions.reduce((sum, t) => sum + Number(t.amount), 0);
            const totalRemaining = totalBudget - totalSpent;

            const handleAddTransaction = async (e) => {
                e.preventDefault();
                if (!newTx.amount || !newTx.place || !newTx.categoryId) return;
                
                const txId = editingTxId || Date.now().toString();
                const transactionData = {
                    ...newTx,
                    id: txId,
                    groupCode,
                    amount: Number(newTx.amount),
                    updatedAt: new Date().toISOString()
                };

                if (editingTxId) {
                    setTransactions(transactions.map(t => t.id === editingTxId ? transactionData : t));
                    setEditingTxId(null);
                } else {
                    setTransactions([transactionData, ...transactions]);
                }

                if (window.FirebaseBridge && window.FirebaseBridge.isAvailable()) {
                    try {
                        const docRef = window.FirebaseBridge.getPublicDoc('transactions', txId);
                        await window.FirebaseBridge.setDoc(docRef, transactionData, { merge: true });
                    } catch (err) {
                        console.error("Error guardando transacción:", err);
                    }
                }

                setNewTx({ date: new Date().toISOString().split('T')[0], amount: '', place: '', categoryId: '', method: 'Débito' }); 
                setActiveTab('dashboard'); 
            };

            const startEditTx = (tx) => {
                setEditingTxId(tx.id);
                setNewTx({ ...tx });
                setActiveTab('add');
            };

            const cancelEditTx = () => {
                setEditingTxId(null);
                setNewTx({ date: new Date().toISOString().split('T')[0], amount: '', place: '', categoryId: '', method: 'Débito' });
                setActiveTab('dashboard');
            };

            const deleteTx = async (id) => {
                setTransactions(transactions.filter(t => t.id !== id));

                if (window.FirebaseBridge && window.FirebaseBridge.isAvailable()) {
                    try {
                        const docRef = window.FirebaseBridge.getPublicDoc('transactions', id);
                        await window.FirebaseBridge.deleteDoc(docRef);
                    } catch (err) {
                        console.error("Error eliminando transacción:", err);
                    }
                }
                triggerToast("Gasto eliminado");
            };

            const handleAddCategory = async (e) => {
                e.preventDefault();
                if (!newCat.name || !newCat.budget) return;

                const catId = Date.now().toString();
                const categoryData = {
                    id: catId,
                    name: newCat.name,
                    budget: Number(newCat.budget),
                    isActive: true,
                    groupCode,
                    updatedAt: new Date().toISOString()
                };

                setCategories([...categories, categoryData]);
                setNewCat({ name: '', budget: '' });

                if (window.FirebaseBridge && window.FirebaseBridge.isAvailable()) {
                    try {
                        const docRef = window.FirebaseBridge.getPublicDoc('categories', catId);
                        await window.FirebaseBridge.setDoc(docRef, categoryData, { merge: true });
                    } catch (err) {
                        console.error("Error guardando categoría:", err);
                    }
                }
            };

            const handleUpdateCategory = async (e) => {
                e.preventDefault();
                const updatedCat = {
                    id: editingCatId,
                    name: editCatData.name,
                    budget: Number(editCatData.budget),
                    isActive: true,
                    groupCode,
                    updatedAt: new Date().toISOString()
                };

                setCategories(categories.map(cat => cat.id === editingCatId ? { ...cat, ...updatedCat } : cat));
                setEditingCatId(null);

                if (window.FirebaseBridge && window.FirebaseBridge.isAvailable()) {
                    try {
                        const docRef = window.FirebaseBridge.getPublicDoc('categories', editingCatId);
                        await window.FirebaseBridge.setDoc(docRef, updatedCat, { merge: true });
                    } catch (err) {

                                    </p>
                                </div>

                                <form onSubmit={handleJoinGroup} className="space-y-3 pt-1">
                                    <label className="block text-xs font-semibold text-slate-700">Unirse al Código de otra persona:</label>
                                    <input 
                                        type="text" 
                                        placeholder="Ej. FAMILIA-2026"
                                        value={inputGroupCode}
                                        onChange={(e) => setInputGroupCode(e.target.value)}
                                        className="w-full uppercase bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 font-semibold"
                                    />
                                    <button 
                                        type="submit"
                                        className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm transition-colors"
                                    >
                                        Unirme a este Grupo
                                    </button>
                                </form>

                                <div className="pt-2 border-t border-slate-100 space-y-2">
                                    <button 
                                        onClick={() => {
                                            uploadLocalDataToCloud();
                                        }}
                                        className="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold py-2.5 rounded-xl border border-emerald-200 flex items-center justify-center gap-2 transition-colors"
                                    >
                                        <IconCloudUpload /> Subir mis datos actuales a este grupo
                                    </button>

                                    <details className="text-xs bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-600" open>
                                        <summary className="font-semibold cursor-pointer text-slate-700 hover:text-slate-900 select-none flex items-center justify-between">
                                            <span>⚙️ Configurar Nube en Vercel</span>
                                            <span className="text-[10px] text-slate-400">Paso a paso</span>
                                        </summary>
                                        <div className="mt-3 space-y-2 text-[11px] leading-relaxed">
                                            <p className="text-slate-600">
                                                Pega el bloque completo que copiaste de Firebase aquí abajo:
                                            </p>
                                            <textarea 
                                                id="firebase-json-input"
                                                rows="4"
                                                placeholder='const firebaseConfig = { apiKey: "...", ... };'
                                                className="w-full font-mono text-[10px] p-2 bg-white border border-slate-300 rounded-lg focus:ring-1 focus:ring-emerald-500"
                                            ></textarea>
                                            <button 
                                                type="button"
                                                onClick={() => {
                                                    const val = document.getElementById('firebase-json-input').value.trim();
                                                    if (!val) {
                                                        triggerToast("Por favor pega la configuración de Firebase");
                                                        return;
                                                    }
                                                    const saved = window.FirebaseBridge.saveCustomConfig(val);
                                                    if (saved) {
                                                        triggerToast("¡Nube conectada! Reiniciando app...");
                                                        setTimeout(() => {
                                                            window.location.reload();
                                                        }, 1200);
                                                    } else {
                                                        triggerToast("No se reconocieron las claves de Firebase.");
                                                    }
                                                }}
                                                className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-bold transition-colors shadow-sm"
                                            >
                                                Guardar y Activar Nube
                                            </button>
                                        </div>
                                    </details>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="p-4 max-w-md mx-auto">
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'add' && renderAddTransaction()}
                        {activeTab === 'categories' && renderCategories()}
                    </main>

                    <nav className="fixed bottom-0 w-full bg-white border-t border-slate-200 pb-safe z-20">
                        <div className="max-w-md mx-auto flex justify-around p-2">
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`flex flex-col items-center p-2 min-w-[70px] ${activeTab === 'dashboard' ? 'text-emerald-600' : 'text-slate-400'}`}
                            >
                                <div className="mb-1"><IconHome /></div>
                                <span className="text-xs font-medium">Resumen</span>
                            </button>
                            
                            <button 
                                onClick={() => {
                                    setEditingTxId(null);
                                    setNewTx({ date: new Date().toISOString().split('T')[0], amount: '', place: '', categoryId: '', method: 'Débito' });
                                    setActiveTab('add');
                                }}
                                className={`flex flex-col items-center p-2 min-w-[70px] ${activeTab === 'add' ? 'text-emerald-600' : 'text-slate-400'}`}
                            >
                                <div className={`rounded-full p-2 mb-1 ${activeTab === 'add' ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100'}`}>
                                    <IconPlus />
                                </div>
                                <span className="text-xs font-medium">Gasto</span>
                            </button>
                            
                            <button 
                                onClick={() => setActiveTab('categories')}
                                className={`flex flex-col items-center p-2 min-w-[70px] ${activeTab === 'categories' ? 'text-emerald-600' : 'text-slate-400'}`}
                            >
                                <div className="mb-1"><IconTags /></div>
                                <span className="text-xs font-medium">Categorías</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
